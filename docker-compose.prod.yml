services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
      - uploadtmp:/app/upload-tmp
      - ${DB_SSL_ROOT_CERT_HOST_PATH}:/run/secrets/postgres-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mathweb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/mathweb-proxy.conf:/etc/nginx/snippets/mathweb-proxy.conf:ro
      - ${TLS_CERT_HOST_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_HOST_PATH}:/etc/nginx/certs/privkey.pem:ro

volumes:
  uploads:
  uploadtmp: