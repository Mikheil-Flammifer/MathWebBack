
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathweb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}


jwt:
  secret: ${JWT_SECRET}

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH:./uploads}
    videos-path: ${FILE_UPLOAD_PATH:./uploads}/videos
    images-path: ${FILE_UPLOAD_PATH:./uploads}/images

otp:
  pepper: ${OTP_PEPPER}

paddle:
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
  api-key: ${PADDLE_API_KEY}
  api-base-url: ${PADDLE_API_BASE_URL:https://sandbox-api.paddle.com}
  checkout-url: ${PADDLE_CHECKOUT_URL}
  checkout-order-ttl: ${PADDLE_CHECKOUT_ORDER_TTL:PT24H}

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  mail-from: ${MAIL_FROM}

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

  cookies:
    secure: false

logging:
  level:
    com.mathweb: DEBUG
    org.springframework.security: INFO
