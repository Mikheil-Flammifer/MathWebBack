
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathweb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH:./uploads}
    videos-path: ${FILE_UPLOAD_PATH:./uploads}/videos
    images-path: ${FILE_UPLOAD_PATH:./uploads}/images

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}
  mail-from: ${MAIL_FROM}

  cookies:
    secure: false

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

logging:
  level:
    com.mathweb: DEBUG
    org.springframework.security: INFO
