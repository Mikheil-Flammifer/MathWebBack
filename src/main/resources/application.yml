spring:
  application:
    name: mathweb

  datasource:
    url: jdbc:postgresql://localhost:5432/mathweb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  cache:
    type: simple

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

otp:
  expiration-minutes: 10
  length: 6

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  subscription:
    price-id: ${STRIPE_PRICE_ID}
    amount: 249
    currency: usd

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH}
    videos-path: ${FILE_UPLOAD_PATH}/videos
    images-path: ${FILE_UPLOAD_PATH}/images

app:
  name: MathWeb
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  max-comment-depth: 10
  max-problem-attempts: 3

logging:
  level:
    com.mathweb: DEBUG
    org.springframework.security: INFO