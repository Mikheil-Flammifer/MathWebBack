spring:
  application:
    name: mathweb

  datasource:
    url: jdbc:postgresql://localhost:5432/mathweb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  cache:
    type: simple

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 min, in ms
  refresh-token-expiration: 604800000  # 7 days, unchanged

otp:
  expiration-minutes: 10
  length: 6

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH}
    videos-path: ${FILE_UPLOAD_PATH}/videos
    images-path: ${FILE_UPLOAD_PATH}/images

paddle:
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}

app:
  name: MathWeb
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  max-comment-depth: 10
  max-problem-attempts: 3
  cookies:
    secure: false            # true in production (HTTPS)
    same-site: Lax
    access-max-age-seconds: 900      # must equal jwt.access-token-expiration / 1000
    refresh-max-age-seconds: 604800  # must equal the refresh token lifetime (unchanged)

logging:
  level:
    com.mathweb: DEBUG
    org.springframework.security: INFO