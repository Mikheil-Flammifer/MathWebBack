
spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mathweb

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  cache:
    type: simple

server:
  port: 8080

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

otp:
  expiration-minutes: 10
  length: 6

app:
  name: MathWeb
  max-comment-depth: 10
  max-problem-attempts: 3
  cookies:
    same-site: Lax
    access-max-age-seconds: 900
    refresh-max-age-seconds: 604800

logging:
  level:
    com.mathweb: INFO
    org.springframework.security: INFO
