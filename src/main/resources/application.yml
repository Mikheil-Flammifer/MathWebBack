spring:
  application:
    name: mathweb

  datasource:
    url: jdbc:postgresql://localhost:5432/mathweb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

  cache:
    type: simple

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

otp:
  expiration-minutes: 10
  length: 6

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: ${PAYPAL_MODE}
  subscription:
    amount: "2.49"
    currency: USD
    plan-name: MathWeb Monthly
    plan-description: Full access to all MathWeb content

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH}
    videos-path: ${FILE_UPLOAD_PATH}/videos
    images-path: ${FILE_UPLOAD_PATH}/images

app:
  name: MathWeb
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  max-comment-depth: 10
  max-problem-attempts: 3

logging:
  level:
    com.mathweb: DEBUG
    org.springframework.security: INFO