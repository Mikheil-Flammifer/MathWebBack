spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mathweb

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      # Keep this lower than the proxy's client_max_body_size (520m).
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:520MB}
      location: ${FILE_UPLOAD_TMP_PATH:./upload-tmp}

  cache:
    type: simple

  lifecycle:
    timeout-per-shutdown-phase: ${GRACEFUL_SHUTDOWN_TIMEOUT:30s}

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-http-form-post-size: ${UPLOAD_MAX_REQUEST_SIZE:520MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

otp:
  expiration-minutes: 10
  length: 6

app:
  name: MathWeb

  mail:
    outbox-encryption-key: ${MAIL_OUTBOX_ENCRYPTION_KEY}
    outbox:
      enabled: ${MAIL_OUTBOX_ENABLED:true}
      poll-ms: ${MAIL_OUTBOX_POLL_MS:5000}
      batch-size: ${MAIL_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
      lease-seconds: ${MAIL_OUTBOX_LEASE_SECONDS:120}
      executor:
        core-pool-size: ${MAIL_OUTBOX_CORE_POOL_SIZE:2}
        max-pool-size: ${MAIL_OUTBOX_MAX_POOL_SIZE:4}
        queue-capacity: ${MAIL_OUTBOX_QUEUE_CAPACITY:200}

  max-comment-depth: 10
  max-problem-attempts: 3
  cookies:
    same-site: Lax
    access-max-age-seconds: 900
    refresh-max-age-seconds: 604800

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
  level:
    com.mathweb: INFO
    org.springframework.security: INFO