
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple

jwt:
  secret: ${JWT_SECRET}

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH}
    videos-path: ${FILE_UPLOAD_PATH}/videos
    images-path: ${FILE_UPLOAD_PATH}/images

paddle:
  webhook-secret: ${PADDLE_WEBHOOK_SECRET}

app:
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}

  cookies:
    secure: true

server:
  tomcat:
    max-swallow-size: 2GB

logging:
  level:
    com.mathweb: INFO
    org.springframework.security: WARN
