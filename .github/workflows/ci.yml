name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Docker is needed by Testcontainers integration tests.
      - name: Start and verify Docker
        run: |
          docker version
          docker info

      # Runs unit tests, integration tests, and the JaCoCo coverage gate.
      - name: Build and test
        run: mvn -B verify
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maven-test-reports
          path: |
            target/failsafe-reports/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn