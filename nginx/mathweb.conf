limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=2r/m;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 520m;
    client_body_timeout 60s;

    # Docker and Prometheus may use Actuator internally; public users cannot.
    location ^~ /actuator/ {
        return 404;
    }

    location ~ ^/api/(videos/upload|videos/[0-9]+/thumbnail|users/me/avatar|problems/[0-9]+/image/(question|explanation))$ {
        limit_req zone=upload_per_ip burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8080;
        include /etc/nginx/snippets/mathweb-proxy.conf;
    }

    location / {
        proxy_pass http://app:8080;
        include /etc/nginx/snippets/mathweb-proxy.conf;
    }
}